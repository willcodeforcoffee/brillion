services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brillion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-brillion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brillion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    # S3-compatible object store for uploaded images (SPEC.md §5).
    # NOTE: verify the official image name/tag and default port against
    # https://rustfs.com before deploying — filled in here as a
    # reasonable placeholder for local development.
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER in .env}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in .env}
    volumes:
      - rustfs_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-brillion}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brillion}
      DOMAIN: ${DOMAIN:-localhost}
      PORT: 3000
      S3_ENDPOINT_INTERNAL: http://rustfs:9000
      S3_ENDPOINT_PUBLIC: https://${DOMAIN:-localhost}/media
      S3_BUCKET: ${S3_BUCKET:-brillion-media}
      S3_ACCESS_KEY: ${RUSTFS_ROOT_USER}
      S3_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD}
      RUST_LOG: ${RUST_LOG:-info}
    command: ["serve"]

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - rustfs
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  rustfs_data:
  caddy_data:
  caddy_config:
